name: gaokao-ln

services:
  db:
    image: postgres:16-alpine
    container_name: gaokao-ln-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: gaokao
      POSTGRES_USER: gaokao
      POSTGRES_PASSWORD: gaokao123
    volumes:
      - gaokao_ln_db_data:/var/lib/postgresql/data
      - ../backups/gaokao_backup_20260807_162352.sql:/docker-entrypoint-initdb.d/01-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gaokao -d gaokao"]
      interval: 10s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./backend
    container_name: gaokao-ln-backend
    restart: unless-stopped
    environment:
      APP_ENV: production
      GAOKAO_DSN: ${GAOKAO_DSN:?Set GAOKAO_DSN to the read-only gaokao_web_ro connection string}
      CORS_ORIGINS: ${CORS_ORIGINS:?Set CORS_ORIGINS to the public HTTPS origin}
      MAX_PAGE_SIZE: "500"
      JWT_SECRET: ${JWT_SECRET:?Set a strong JWT_SECRET}
      JWT_EXPIRE_HOURS: "168"
      USER_DB_PATH: /app/data/users.db
      AGENT_DB_PATH: /app/data/agent.db
      AGENT_ENABLED: ${AGENT_ENABLED:-false}
      AGENT_ALLOWLIST: ${AGENT_ALLOWLIST:-}
      AGENT_DAILY_TOKEN_BUDGET: ${AGENT_DAILY_TOKEN_BUDGET:-200000}
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT:-}
      AZURE_OPENAI_DEPLOYMENT: ${AZURE_OPENAI_DEPLOYMENT:-se-gpt-5.6-sol}
      AZURE_OPENAI_API_VERSION: ${AZURE_OPENAI_API_VERSION:-2024-12-01-preview}
      AZURE_TENANT_ID: ${AZURE_TENANT_ID:-}
      AZURE_CLIENT_ID: ${AZURE_CLIENT_ID:-}
      AZURE_CLIENT_SECRET_FILE: /run/secrets/azure-client-secret
      HOT_IMAGE_ROOT: /home/ekewang/projects/gaokao/ln/2026allmaterial/热门大学介绍
      GUIDE_PDF_ROOT: /home/ekewang/projects/gaokao/ln/2026allmaterial
      GUIDE_HTML_DIR: /app/static/guides
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - backend_user_data:/app/data
      - /var/lib/nir-report-secrets/azure-client-secret:/run/secrets/azure-client-secret:ro
      - ../2026allmaterial:/home/ekewang/projects/gaokao/ln/2026allmaterial:ro
      - ./backend/static:/app/static:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 20

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE: ""
    container_name: gaokao-ln-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "4000:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20

volumes:
  gaokao_ln_db_data:
  backend_user_data:
